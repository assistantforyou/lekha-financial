<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0E11">
<meta name="description" content="LEKHA Financials: one research workspace for your portfolio, companies, filings, news, macro data and an AI analyst that cites its sources.">
<title>LEKHA Financials · Investment Intelligence Terminal</title>
<link rel="icon" href="/v3/brand/lekha-logo-white.png">
<script>/* pre-paint: theme (shared key with V3), text size, density, language */
try{var r=document.documentElement,p=JSON.parse(localStorage.getItem("ptpub.v1.prefs")||"null")||{},th=JSON.parse(localStorage.getItem("ptpub.v1.v3.theme")||"null")||"lekha-teal";
if(th==="light")r.setAttribute("data-theme","light");
if(th!=="auto"&&th!=="light"&&th!=="dark"){var tv=JSON.parse(localStorage.getItem("ptpub.v1.themeVars")||"null");if(tv&&tv.id===th){r.setAttribute("data-theme",tv.kind);for(var k in tv.vars)r.style.setProperty(k,tv.vars[k]);r.style.setProperty("color-scheme",tv.kind)}}
if(p.lang&&/^[a-zA-Z-]+$/.test(p.lang)&&p.lang!=="en")document.write('<script src="/i18n/'+p.lang+'.js"><\/script>');
r.style.setProperty("--zoom",{S:.92,M:1,L:1.12,XL:1.25}[p.size]||1);if(p.density==="compact")r.setAttribute("data-density","compact")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/app/classic.css">
<script type="module" src="/src/main.jsx"></script>
</head>
<body>
<div id="root"></div>
<!-- Classic engine stage: every V2/V3 panel lives here (hidden) until the shell moves it into view. -->
<div id="stage" hidden>
<!--@stage-->
</div>
<!-- Engine controls the classic scripts bind to. They stay hidden; the React shell mirrors and proxies them. -->
<header class="bar" id="engine-bar" hidden>
  <span class="tick" id="brand-tier"></span>
  <div class="seg tabs"><button id="tb-ov">Overview</button><button id="tb-val">Intrinsic value</button><button id="tb-set">Settings</button></div>
  <div class="status">
    <span class="pill" id="st-prices">Prices: loading</span><span class="pill" id="st-news">News: loading</span>
    <div class="seg" role="group" aria-label="Display currency"><button id="cur-usd" aria-pressed="true">USD</button><button id="cur-thb" aria-pressed="false">THB</button></div>
    <button class="btn" id="refresh" type="button">Refresh</button><a class="btn" id="acct" href="/login.html">Sign in</a>
  </div>
</header>
<div id="demo-banner" hidden><b>DEMO</b><span></span><a id="demo-cta"></a></div>
<script>window.LEKHA_LAYOUT={tabs:["pf-overview","pf-holdings","pf-risk","mac-regime","mac-rotation","mac-intel","mac-appetite","val","sec-now","sec-rrg","sec-lead","sec-breadth"],names:{"pf-overview":"My Portfolio · Overview","pf-holdings":"My Portfolio · Holdings","val":"Deep Analysis · Intrinsic Value","sec-now":"Sector Rotation · Right Now"}};</script>
<script src="/app/shell-bridge.js"></script>
<script src="/v2/pt-i18n.js"></script>
<script src="/pt-demo.js"></script>
<script src="/pt-chunk.js"></script>
<script src="/pt-datasource.js"></script>
<script src="/pt-state.js"></script>
<script src="/v3/lekha-engine.js"></script>
<script src="/app/lekha-themes.js"></script>
<script src="/v2/pt-import.js"></script>
<script src="/app/lekha-ui.js"></script>
<script src="/v3/lekha-analyst.js"></script>
<script src="/v3/lekha-account.js"></script>
<script src="/v2/pt-projection.js"></script>
</body>
</html>
