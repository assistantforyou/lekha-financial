<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Portfolio Terminal</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#0D131B;--panel:#141C26;--panel-2:#1B2531;--line:#263241;--fg:#E6EBF1;--muted:#A7B3C1;--accent:#5B9DFF;--up:#3DD68C;--down:#FF5C5C;--radius:12px}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 600px at 50% -10%,#182334,transparent 60%),var(--bg);color:var(--fg);
       font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:grid;place-items:center;padding:24px}
  .card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        padding:26px 24px 22px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .brand{display:flex;align-items:center;gap:10px;font-size:15px;letter-spacing:.02em}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--up);box-shadow:0 0 0 4px rgba(61,214,140,.14)}
  .tick{margin-left:auto;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;letter-spacing:.08em}
  h1{font-size:17px;margin:20px 0 4px;font-weight:600}
  p.sub{color:var(--muted);margin:0 0 18px;font-size:12.5px}
  label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
  input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--fg);
        padding:11px 12px;font:inherit;outline:none}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,157,255,.16)}
  button{width:100%;margin-top:18px;padding:11px 12px;border-radius:8px;border:1px solid var(--accent);
         background:var(--accent);color:#07101d;font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.55;cursor:default}
  button.ghost{margin-top:10px;background:transparent;border-color:var(--line);color:var(--fg);font-weight:500}
  button.link{width:auto;margin:14px 0 0;padding:0;background:none;border:none;color:var(--muted);font-weight:400;
              text-decoration:underline;cursor:pointer}
  .msg{min-height:18px;margin-top:12px;font-size:12.5px;color:var(--muted)}
  .msg.err{color:var(--down)} .msg.ok{color:var(--up)}
  .foot{display:flex;align-items:center;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
        color:var(--muted);font-size:11.5px}
  .foot a{margin-left:auto;color:var(--muted)}
  .hidden{display:none!important}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><span class="dot"></span>Portfolio Terminal<span class="tick">OWNER</span></div>

  <section id="setup-panel" class="hidden">
    <h1>Create the owner account</h1>
    <p class="sub">This install has no account yet. The address you use here becomes the only one that can sign in.</p>
    <form id="setup-form" autocomplete="on">
      <label for="s-email">Email</label>
      <input id="s-email" type="email" autocomplete="username" required>
      <label for="s-pw">Password</label>
      <input id="s-pw" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
      <label for="s-pw2">Repeat password</label>
      <input id="s-pw2" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
      <button type="submit" id="s-go">Create account &amp; continue</button>
    </form>
    <p class="msg" id="s-msg"></p>
  </section>

  <section id="login-panel">
    <h1>Sign in</h1>
    <p class="sub">Your holdings, valuations and saved work are stored on the server and follow you to any browser.</p>
    <form id="login-form" autocomplete="on">
      <label for="l-email">Email</label>
      <input id="l-email" type="email" autocomplete="username" required>
      <label for="l-pw">Password</label>
      <input id="l-pw" type="password" autocomplete="current-password" minlength="8" maxlength="72" required>
      <button type="submit" id="l-go">Sign in</button>
    </form>
    <button class="link" id="forgot" type="button">Forgot password?</button>
    <p class="msg" id="l-msg"></p>
  </section>

  <div class="foot"><span>State is saved server-side.</span><a href="/">Back to app</a></div>
</main>

<script>
(function () {
  var AUTH = window.PT_AUTH;
  var SKEY = "ptpub.v1.session";
  function ls(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }
  function say(id, text, kind) { var e = document.getElementById(id); e.textContent = text || ""; e.className = "msg" + (kind ? " " + kind : ""); }
  function post(path, body) {
    return fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); });
  }
  function go() { location.replace("/"); }
  function saveSession(s) { try { localStorage.setItem(SKEY, JSON.stringify(s)); } catch (e) {} }

  /* already signed in? verify, then go straight in */
  if (AUTH && AUTH.session()) {
    AUTH.fetch("/api/auth/me").then(function (r) { if (r.ok) go(); }).catch(function () {});
  }

  /* first run: offer the one-time account creation */
  fetch("/api/auth/setup").then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
    if (j && j.needed) {
      document.getElementById("setup-panel").classList.remove("hidden");
      document.getElementById("login-panel").classList.add("hidden");
      document.getElementById("s-email").focus();
    } else { document.getElementById("l-email").focus(); }
  }).catch(function () { document.getElementById("l-email").focus(); });

  document.getElementById("login-form").onsubmit = async function (ev) {
    ev.preventDefault();
    var btn = document.getElementById("l-go");
    var email = document.getElementById("l-email").value.trim(), pw = document.getElementById("l-pw").value;
    btn.disabled = true; say("l-msg", "Signing in…");
    try {
      var r = await post("/api/auth/login", { email: email, password: pw, owner: true });
      if (!r.ok || !r.j.session) { say("l-msg", (r.j && r.j.error) || "Wrong email or password.", "err"); return; }
      saveSession(r.j.session);
      var me = await AUTH.fetch("/api/auth/me").then(function (x) { return x.ok ? x.json() : null; }).catch(function () { return null; });
      if (!me) { saveSession(null); say("l-msg", "That session could not be verified.", "err"); return; }
      if (me.is_admin === false && (await fetch("/api/auth/setup").then(function (x) { return x.ok ? x.json() : null; }).catch(function () { return null; }) || {}).owner_list) {
        saveSession(null);
        say("l-msg", "This site is private.", "err");
        return;
      }
      say("l-msg", "Signed in.", "ok");
      go();
    } catch (e) { say("l-msg", "Could not reach the server.", "err"); }
    finally { btn.disabled = false; }
  };

  document.getElementById("setup-form").onsubmit = async function (ev) {
    ev.preventDefault();
    var btn = document.getElementById("s-go");
    var email = document.getElementById("s-email").value.trim();
    var pw = document.getElementById("s-pw").value, pw2 = document.getElementById("s-pw2").value;
    if (pw !== pw2) { say("s-msg", "The two passwords do not match.", "err"); return; }
    btn.disabled = true; say("s-msg", "Creating your account…");
    try {
      var r = await post("/api/auth/setup", { email: email, password: pw });
      if (!r.ok) { say("s-msg", (r.j && r.j.error) || "Could not create the account.", "err"); return; }
      if (r.j.session) { saveSession(r.j.session); say("s-msg", "Account created.", "ok"); go(); }
      else { say("s-msg", r.j.message || "Account created. Sign in.", "ok"); location.replace("/login.html"); }
    } catch (e) { say("s-msg", "Could not reach the server.", "err"); }
    finally { btn.disabled = false; }
  };

  document.getElementById("forgot").onclick = async function () {
    var email = document.getElementById("l-email").value.trim();
    if (!email) { say("l-msg", "Type your email first, then press Forgot password.", "err"); return; }
    var r = await post("/api/auth/recover", { email: email }).catch(function () { return null; });
    say("l-msg", (r && r.j && r.j.message) || "If that email has an account, a reset link is on its way.", r && r.ok ? "ok" : "err");
  };
})();
</script>
<script src="pt-datasource.js"></script>
</body>
</html>
